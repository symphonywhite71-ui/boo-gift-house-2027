function compressPhoto(file,done){if(!file)return done('');if(!file.type||!file.type.startsWith('image/'))return alert('Pilih file foto JPG, PNG, atau HEIC.'),done('');const reader=new FileReader();reader.onerror=()=>{alert('Foto tidak dapat dibaca. Coba pilih foto lain.');done('')};reader.onload=()=>{const img=new Image();img.onerror=()=>{alert('Format foto tidak didukung. Coba simpan sebagai JPG.');done('')};img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);done(canvas.toDataURL('image/jpeg',0.72))};img.src=reader.result};reader.readAsDataURL(file)}
function previewFile(file,target){if(!file)return;compressPhoto(file,data=>{if(!data)return;let el=$('#'+target);if(el){el.src=data;el.classList.remove('hidden')}})}

function downloadCSV(filename,headers,rows,summaryRows=[]){
 const cell=v=>{let x=String(v??'');if(/^[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"';};
 const lines=[headers,...rows,...summaryRows].map(row=>row.map(cell).join(';'));
 const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
