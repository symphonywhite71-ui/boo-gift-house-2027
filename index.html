<title>Boo Gift House · Lebaran 2027</title>
<style>
:root{--blue:#86b0dd;--blue2:#eaf3fb;--ink:#253344;--muted:#718096;--line:#e5ebf1;--bg:#f5f8fb;--white:#fff;--green:#27845c;--red:#b84b4b;--gold:#d39a35;--shadow:0 8px 28px #24364b0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:90px}.top{background:linear-gradient(125deg,#86b0dd,#b9d2eb);padding:24px 18px 20px;color:#16324c;border-radius:0 0 26px 26px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:800;letter-spacing:.3px}.sub{font-size:12px;opacity:.8;letter-spacing:1.4px}.top p{margin:18px 0 0;font-size:13px;opacity:.85}.wrap{padding:18px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 0 16px}.pagehead h2{margin:0;font-size:21px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);min-width:0}.statlabel{font-size:12px;color:var(--muted)}.stat{font-size:21px;font-weight:800;margin-top:5px;overflow-wrap:anywhere}.stat.small{font-size:17px}.sectiontitle{font-size:15px;font-weight:750;margin:20px 0 10px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:#16324c;font-weight:700}.btn.secondary{background:var(--blue2);color:#315878}.btn.ghost{background:#f2f5f8;color:#526273}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#ffffffef;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));}.tabrow{display:flex;max-width:800px;width:100%;justify-content:space-around;gap:4px}.tab{border:0;background:transparent;color:#78889a;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;padding:5px 8px;border-radius:10px;min-width:52px}.tab .ico{font-size:19px}.tab.active{color:#315f88;background:var(--blue2);font-weight:800}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:700;color:#536477}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4ec;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #86b0dd30}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.formgrid .wide{grid-column:1/-1}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.thumb{width:56px;height:56px;flex:none;border-radius:12px;object-fit:cover;background:#edf3f8}.itemmain{flex:1;min-width:0}.itemmain strong{display:block;overflow:hidden;text-overflow:ellipsis}.itemmain small{color:var(--muted)}.right{text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf4fa;color:#456887;font-size:11px;font-weight:700}.pill.green{background:#e8f6ef;color:var(--green)}.pill.red{background:#fff0f0;color:var(--red)}.empty{text-align:center;padding:28px 14px;color:var(--muted)}.empty b{display:block;color:#526477;margin-bottom:5px}.notice{background:#fff8e9;border:1px solid #f3e2b9;color:#775b25;padding:12px;border-radius:13px;font-size:12px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;font-size:12px;background:#fff;min-width:520px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f5f8fb;color:#607185}td.num,th.num{text-align:right;white-space:nowrap}.modalback{position:fixed;inset:0;background:#14223577;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h3{margin:0}.close{border:0;background:#f0f3f6;border-radius:50%;width:34px;height:34px}.hidden{display:none!important}.photo{width:100%;max-height:190px;object-fit:cover;border-radius:14px;background:#eef3f8}.footnote{font-size:11px;color:var(--muted);margin-top:12px}.orderstatus{display:flex;gap:6px;flex-wrap:wrap}.progress{height:8px;background:#edf1f5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#77ae91}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:#203247;color:white;padding:10px 15px;border-radius:99px;font-size:13px;box-shadow:var(--shadow)}
@media(min-width:720px){.top{padding:30px 30px}.wrap{padding:24px 30px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{bottom:18px;left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 36px));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px}.tab{font-size:11px;min-width:76px}.modalback{align-items:center}}
@media(max-width:390px){.tab{padding:5px 4px;min-width:45px}.tab .ico{font-size:17px}.stat{font-size:18px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style></head><body><div class="app"><header class="top"><div class="topline"><div><div class="brand">BOO GIFT HOUSE</div><div class="sub">LEBARAN 2027 · BUSINESS MANAGER</div></div><span class="pill">Versi awal</span></div><p>Kelola HPP, stok, pembelian, pesanan, dan keuntungan dalam satu tempat.</p></header><main class="wrap" id="view"></main></div><nav class="tabs"><div class="tabrow" id="tabs"></div></nav><div id="modalroot"></div><div id="toast" class="toast hidden"></div>
<script>
const DB='booGiftHouse2027';let state={products:[],materials:[],purchases:[],orders:[],settings:{target:250}};let page='home',editing=null;
const $=s=>document.querySelector(s);const rupiah=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');const num=v=>Math.max(0,Number(v)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){localStorage.setItem(DB,JSON.stringify(state))}function load(){try{let x=JSON.parse(localStorage.getItem(DB));if(x)state={...state,...x}}catch(e){} if(!state.products.length)state.products=Array.from({length:5},(_,i)=>({id:id(),name:`Parsel 0${i+1}`,price:0,target:0,photo:'',recipe:[],overhead:{electric:0,fuel:0,tools:0,labor:0,other:0}}));save()}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
const nav=[['home','⌂','Beranda'],['products','🎁','Parsel'],['materials','📦','Stok'],['purchases','🛒','Belanja'],['orders','🧾','Order'],['reports','▥','Laporan']];function renderTabs(){$('#tabs').innerHTML=nav.map(([k,i,n])=>`<button class="tab ${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${n}</button>`).join('')}
function go(p){page=p;editing=null;render()}
function allHpp(p){let direct=(p.recipe||[]).reduce((s,r)=>s+materialCost(r.materialId,r.qty,r.unit),0);let o=p.overhead||{};return direct+num(o.electric)+num(o.fuel)+num(o.tools)+num(o.labor)+num(o.other)}
function materialCost(mid,qty,unit){let m=state.materials.find(x=>x.id===mid);if(!m)return 0;let factor=convert(1,unit,m.unit);if(!factor)return 0;return num(m.price)/(num(m.packQty)||1)*num(qty)*factor}
function convert(q,from,to){if(from===to)return q;let f={cm:['length',.01],m:['length',1],mm:['length',.001],g:['weight',.001],kg:['weight',1],ml:['volume',.001],l:['volume',1],pcs:['count',1],lembar:['count',1],batang:['count',1],pack:['count',1],roll:['count',1],unit:['count',1]};if(!f[from]||!f[to]||f[from][0]!==f[to][0])return null;return q*f[from][1]/f[to][1]}
function stockBase(m){return num(m.stock)}function neededMaterial(m){return state.products.reduce((sum,p)=>sum+(p.recipe||[]).reduce((a,r)=>{if(r.materialId!==m.id)return a;let f=convert(1,r.unit,m.unit);return a+(f?num(r.qty)*f*num(p.target):0)},0),0)}function soldQty(p){return state.orders.filter(o=>o.productId===p.id).reduce((s,o)=>s+num(o.qty),0)}function totalOrders(){return state.orders.reduce((s,o)=>s+num(o.total),0)}function paidOrders(){return state.orders.filter(o=>o.status==='Lunas').reduce((s,o)=>s+num(o.total),0)}function render(){renderTabs();let v=$('#view');v.innerHTML=({home:homePage,products:productsPage,materials:materialsPage,purchases:purchasesPage,orders:ordersPage,reports:reportsPage}[page])();}
function homePage(){let revenue=totalOrders(),sales=state.orders.reduce((s,o)=>s+num(o.price)*num(o.qty),0),cost=state.orders.reduce((s,o)=>{let p=state.products.find(x=>x.id===o.productId);return s+(p?allHpp(p)*num(o.qty):0)},0);let profit=sales-cost;return `<div class="pagehead"><div><h2>Ringkasan usaha</h2><div class="muted">Pantau persiapan Parsel Lebaran 2027</div></div><button class="btn small secondary" onclick="exportData()">Backup data</button></div><div class="grid"><div class="card"><div class="statlabel">Total order</div><div class="stat">${state.orders.length}</div></div><div class="card"><div class="statlabel">Omzet tercatat</div><div class="stat">${rupiah(revenue)}</div></div><div class="card"><div class="statlabel">Estimasi HPP terjual</div><div class="stat">${rupiah(cost)}</div></div><div class="card"><div class="statlabel">Estimasi selisih</div><div class="stat" style="color:${profit>=0?'var(--green)':'var(--red)'}">${rupiah(profit)}</div></div></div><div class="sectiontitle">Persiapan produksi</div><div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>Target parsel</b><b>${state.settings.target||250} pcs</b></div><div class="progress" style="margin:10px 0"><span style="width:${Math.min(100,state.products.reduce((s,p)=>s+num(p.target),0)/(state.settings.target||250)*100)}%"></span></div><div class="muted">Target per jenis dapat diatur di menu Parsel. Total target saat ini: ${state.products.reduce((s,p)=>s+num(p.target),0)} pcs.</div><div class="field"><label>Total target produksi</label><input id="target" type="number" min="0" value="${state.settings.target||250}" onchange="state.settings.target=num(this.value);save();render()"></div></div><div class="sectiontitle">Akses cepat</div><div class="grid three"><button class="card" onclick="openProduct()">🎁<br><b>Tambah parsel</b></button><button class="card" onclick="openMaterial()">📦<br><b>Tambah stok</b></button><button class="card" onclick="openOrder()">🧾<br><b>Catat order</b></button></div><div class="notice">Penting: aplikasi versi awal menyimpan data di browser HP ini. Lakukan Backup Data secara berkala agar data dan foto tidak hilang jika browser dihapus atau berganti perangkat.</div>`}
function productsPage(){return `<div class="pagehead"><div><h2>Daftar parsel</h2><div class="muted">Buat 5 jenis hampers dan hitung HPP masing-masing.</div></div><button class="btn small" onclick="openProduct()">＋ Parsel</button></div><div class="list">${state.products.map(p=>`<div class="item">${p.photo?`<img class="thumb" src="${p.photo}">`:`<div class="thumb" style="display:grid;place-items:center;font-size:24px">🎁</div>`}<div class="itemmain"><strong>${esc(p.name)}</strong><small>HPP ${rupiah(allHpp(p))} · Harga jual ${rupiah(p.price)}</small><small>Target ${num(p.target)} pcs · Terjual ${soldQty(p)} pcs</small></div><div class="right"><button class="btn small secondary" onclick="openProduct('${p.id}')">Atur</button><div style="margin-top:5px"><button class="btn small ghost" onclick="openRecipe('${p.id}')">Bahan</button></div></div></div>`).join('')||'<div class="empty">Belum ada parsel.</div>'}</div>`}
function materialsPage(){return `<div class="pagehead"><div><h2>Stok bahan</h2><div class="muted">Isi harga beli per kemasan, isi kemasan, dan stok tersedia.</div></div><button class="btn small" onclick="openMaterial()">＋ Bahan</button></div><div class="notice">Contoh: rantai emas dibeli 1 roll seharga Rp30.000, panjang 30 meter. Isi kemasan = 30, satuan = meter. Jika dipakai 40 cm per parsel, masukkan pemakaian 0,4 meter di resep.</div><div class="list">${state.materials.map(m=>`<div class="item"><div class="thumb" style="display:grid;place-items:center;font-size:23px">${m.photo?`<img class="thumb" src="${m.photo}">`:'📦'}</div><div class="itemmain"><strong>${esc(m.name)}</strong><small>${rupiah(m.price)} / ${num(m.packQty)} ${esc(m.unit)} · Stok ${num(m.stock)} ${esc(m.unit)}</small><small>Kebutuhan target: ${neededMaterial(m).toLocaleString('id-ID')} ${esc(m.unit)} · ${neededMaterial(m)>num(m.stock)?'<span style="color:var(--red)">Stok kurang</span>':'<span style="color:var(--green)">Stok cukup</span>'}</small><small>${esc(m.source||'Pemasok belum diisi')}</small></div><button class="btn small secondary" onclick="openMaterial('${m.id}')">Edit</button></div>`).join('')||'<div class="empty"><b>Belum ada bahan</b>Tambahkan keranjang, mangkok, snack, rumbai, rantai emas, dan lainnya.</div>'}</div>`}
function purchasesPage(){return `<div class="pagehead"><div><h2>Pembelian barang</h2><div class="muted">Catat belanja Shopee maupun toko offline.</div></div><button class="btn small" onclick="openPurchase()">＋ Pembelian</button></div><div class="list">${state.purchases.slice().reverse().map(x=>`<div class="item"><div class="thumb" style="display:grid;place-items:center;font-size:22px">🛍️</div><div class="itemmain"><strong>${esc(x.materialName)}</strong><small>${esc(x.source)} · ${esc(x.date)}</small><small>${num(x.qty)} ${esc(x.unit)} + ongkir ${rupiah(x.shipping)}</small></div><b>${rupiah(x.total)}</b></div>`).join('')||'<div class="empty"><b>Belum ada pembelian</b>Setiap pembelian akan menambah stok bahan.</div>'}</div>`}
function ordersPage(){return `<div class="pagehead"><div><h2>Order pelanggan</h2><div class="muted">Catat pesanan, ongkir, metode, dan status pembayaran.</div></div><button class="btn small" onclick="openOrder()">＋ Order</button></div><div class="list">${state.orders.slice().reverse().map(o=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.customer)}</b><span class="pill ${o.status==='Lunas'?'green':'red'}">${esc(o.status)}</span></div><div class="muted">${esc(o.productName)} · ${o.date}</div><div style="display:flex;justify-content:space-between;margin-top:9px"><span class="muted">${num(o.qty)} × ${rupiah(o.price)} · Ongkir ${rupiah(o.shipping)}</span><b>${rupiah(o.total)}</b></div><div class="orderstatus" style="margin-top:9px"><span class="pill">${esc(o.payment)}</span><button class="btn small secondary" onclick="togglePaid('${o.id}')">${o.status==='Lunas'?'Tandai belum bayar':'Tandai lunas'}</button><button class="btn small ghost" onclick="deleteOrder('${o.id}')">Hapus</button></div></div>`).join('')||'<div class="empty"><b>Belum ada order</b>Pesanan pelanggan akan tampil di sini.</div>'}</div>`}
function reportsPage(){let rev=state.orders.reduce((s,o)=>s+num(o.price)*num(o.qty),0),hpp=state.orders.reduce((s,o)=>{let p=state.products.find(x=>x.id===o.productId);return s+(p?allHpp(p)*num(o.qty):0)},0),ship=state.orders.reduce((s,o)=>s+num(o.shipping),0),paid=paidOrders();return `<div class="pagehead"><div><h2>Laporan usaha</h2><div class="muted">Ringkasan berdasarkan order yang dicatat.</div></div><button class="btn small secondary" onclick="exportCSV()">Unduh CSV</button></div><div class="grid"><div class="card"><div class="statlabel">Omzet pesanan</div><div class="stat">${rupiah(rev)}</div></div><div class="card"><div class="statlabel">Estimasi HPP produk terjual</div><div class="stat">${rupiah(hpp)}</div></div><div class="card"><div class="statlabel">Ongkir yang ditagihkan</div><div class="stat">${rupiah(ship)}</div></div><div class="card"><div class="statlabel">Pembayaran lunas</div><div class="stat">${rupiah(paid)}</div></div></div><div class="card" style="margin-top:12px"><div class="statlabel">Estimasi laba kotor produk</div><div class="stat" style="color:${rev-hpp>=0?'var(--green)':'var(--red)'}">${rupiah(rev-hpp)}</div><p class="muted">Perhitungan ini adalah harga jual produk dikurangi HPP resep dan overhead per parsel. Ongkir dipisahkan. Belum termasuk biaya lain yang belum kamu masukkan.</p></div><div class="sectiontitle">Rincian HPP per jenis parsel</div><div class="tablewrap"><table><thead><tr><th>Jenis</th><th class="num">HPP / pcs</th><th class="num">Harga jual</th><th class="num">Selisih</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${rupiah(allHpp(p))}</td><td class="num">${rupiah(p.price)}</td><td class="num">${rupiah(num(p.price)-allHpp(p))}</td></tr>`).join('')}</tbody></table></div><div class="sectiontitle">Backup & pemulihan</div><div class="card"><p class="muted">Simpan salinan data untuk berjaga-jaga. File backup mencakup data dan foto produk/bahan.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Backup JSON</button><label class="btn ghost">Pulihkan backup<input type="file" accept="application/json" hidden onchange="importData(this)"></label></div></div>`}
function modal(title,body){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</section></div>`}function closeModal(){$('#modalroot').innerHTML=''}
function openProduct(pid){let p=state.products.find(x=>x.id===pid)||{id:id(),name:'Parsel baru',price:0,target:0,photo:'',recipe:[],overhead:{electric:0,fuel:0,tools:0,labor:0,other:0}};let isNew=!state.products.some(x=>x.id===p.id);modal(isNew?'Tambah parsel':'Edit parsel',`<form onsubmit="saveProduct(event,'${p.id}',${isNew})"><div class="field"><label>Nama jenis parsel</label><input name="name" required value="${esc(p.name)}" placeholder="Contoh: Parsel Hijau"></div><div class="formgrid"><div class="field"><label>Harga jual per parsel (Rp)</label><input name="price" type="number" min="0" value="${num(p.price)}"></div><div class="field"><label>Target produksi (pcs)</label><input name="target" type="number" min="0" value="${num(p.target)}"></div></div><div class="field"><label>Foto parsel</label><input type="file" accept="image/*" id="prodphoto"><img id="prodpreview" class="photo ${p.photo?'':'hidden'}" src="${p.photo||''}"></div><div class="sectiontitle">Biaya tambahan per parsel</div><div class="formgrid"><div class="field"><label>Listrik (Rp)</label><input name="electric" type="number" min="0" value="${num(p.overhead?.electric)}"></div><div class="field"><label>Bensin belanja (Rp)</label><input name="fuel" type="number" min="0" value="${num(p.overhead?.fuel)}"></div><div class="field"><label>Penyusutan alat (Rp)</label><input name="tools" type="number" min="0" value="${num(p.overhead?.tools)}"></div><div class="field"><label>Jasa membuat (Rp)</label><input name="labor" type="number" min="0" value="${num(p.overhead?.labor)}"></div><div class="field wide"><label>Biaya lain-lain (Rp)</label><input name="other" type="number" min="0" value="${num(p.overhead?.other)}"></div></div><div class="notice">Masukkan biaya tambahan yang dialokasikan untuk satu parsel. Bahan utama seperti keranjang, mangkok, snack, pita, rumbai, dan rantai dicatat di menu Bahan lalu dimasukkan ke resep.</div><div class="actions"><button class="btn" type="submit">Simpan parsel</button>${isNew?'':`<button class="btn danger" type="button" onclick="removeProduct('${p.id}')">Hapus</button>`}</div></form>`);$('#prodphoto').onchange=e=>previewFile(e.target.files[0],'prodpreview')}
function saveProduct(e,pid,isNew){e.preventDefault();let f=e.target,old=state.products.find(x=>x.id===pid)||{},p={...old,id:pid,name:f.name.value,price:num(f.price.value),target:num(f.target.value),photo:old.photo||'',recipe:old.recipe||[],overhead:{electric:num(f.electric.value),fuel:num(f.fuel.value),tools:num(f.tools.value),labor:num(f.labor.value),other:num(f.other.value)}};let file=$('#prodphoto').files[0];if(file){let r=new FileReader();r.onload=()=>{p.photo=r.result;finish()};r.readAsDataURL(file)}else finish();function finish(){if(isNew)state.products.push(p);else state.products[state.products.findIndex(x=>x.id===pid)]=p;save();closeModal();render();toast('Parsel disimpan')}}
function removeProduct(pid){if(confirm('Hapus jenis parsel ini?')){state.products=state.products.filter(p=>p.id!==pid);save();closeModal();render()}}
function openMaterial(mid){let m=state.materials.find(x=>x.id===mid)||{id:id(),name:'',price:0,packQty:1,unit:'pcs',stock:0,source:'',photo:''};let isNew=!state.materials.some(x=>x.id===m.id);modal(isNew?'Tambah bahan':'Edit bahan',`<form onsubmit="saveMaterial(event,'${m.id}',${isNew})"><div class="field"><label>Nama bahan / alat</label><input name="name" required value="${esc(m.name)}" placeholder="Contoh: Rantai emas"></div><div class="formgrid"><div class="field"><label>Harga beli kemasan (Rp)</label><input name="price" type="number" min="0" required value="${num(m.price)}"></div><div class="field"><label>Isi kemasan</label><input name="packQty" type="number" min="0.001" step="any" required value="${num(m.packQty)}"></div><div class="field"><label>Satuan isi</label><select name="unit">${['pcs','m','cm','mm','kg','g','l','ml','lembar','batang','pack','roll','unit'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Stok tersedia (satuan di atas)</label><input name="stock" type="number" min="0" step="any" value="${num(m.stock)}"></div><div class="field wide"><label>Sumber pembelian</label><input name="source" value="${esc(m.source)}" placeholder="Shopee / nama toko offline"></div><div class="field wide"><label>Foto bahan (opsional)</label><input type="file" id="matphoto" accept="image/*"><img id="matpreview" class="photo ${m.photo?'':'hidden'}" src="${m.photo||''}"></div></div><div class="notice">Biaya per satuan dihitung otomatis: harga kemasan ÷ isi kemasan. Satuan panjang (m/cm/mm), berat (kg/g), dan volume (l/ml) dapat dikonversi otomatis di resep.</div><div class="actions"><button class="btn">Simpan bahan</button>${isNew?'':`<button class="btn danger" type="button" onclick="removeMaterial('${m.id}')">Hapus</button>`}</div></form>`);$('#matphoto').onchange=e=>previewFile(e.target.files[0],'matpreview')}
function saveMaterial(e,mid,isNew){e.preventDefault();let f=e.target,old=state.materials.find(x=>x.id===mid)||{},m={...old,id:mid,name:f.name.value,price:num(f.price.value),packQty:num(f.packQty.value),unit:f.unit.value,stock:num(f.stock.value),source:f.source.value,photo:old.photo||''};let file=$('#matphoto').files[0];if(file){let r=new FileReader();r.onload=()=>{m.photo=r.result;finish()};r.readAsDataURL(file)}else finish();function finish(){if(isNew)state.materials.push(m);else state.materials[state.materials.findIndex(x=>x.id===mid)]=m;save();closeModal();render();toast('Bahan disimpan')}}
function removeMaterial(mid){if(confirm('Hapus bahan ini?')){state.materials=state.materials.filter(m=>m.id!==mid);state.products.forEach(p=>p.recipe=(p.recipe||[]).filter(r=>r.materialId!==mid));save();closeModal();render()}}
function openRecipe(pid){let p=state.products.find(x=>x.id===pid);if(!p)return;modal(`Resep bahan · ${esc(p.name)}`,`<div class="muted">Tambahkan bahan yang digunakan untuk membuat satu parsel. HPP akan dihitung dari harga beli per satuan.</div><div class="list" style="margin-top:12px">${(p.recipe||[]).map((r,i)=>{let m=state.materials.find(x=>x.id===r.materialId);return `<div class="item"><div class="itemmain"><b>${esc(m?.name||'Bahan dihapus')}</b><small>${r.qty} ${esc(r.unit)} · ${rupiah(materialCost(r.materialId,r.qty,r.unit))}</small></div><button class="btn small danger" onclick="removeRecipe('${pid}',${i})">Hapus</button></div>`}).join('')||'<div class="empty">Belum ada bahan dalam resep.</div>'}</div><form onsubmit="addRecipe(event,'${pid}')"><div class="field"><label>Pilih bahan</label><select name="material" required>${state.materials.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.unit)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Jumlah pemakaian</label><input name="qty" type="number" min="0.001" step="any" required placeholder="Contoh 0,4"></div><div class="field"><label>Satuan pemakaian</label><select name="unit">${['pcs','m','cm','mm','kg','g','l','ml','lembar','batang','pack','roll','unit'].map(u=>`<option>${u}</option>`).join('')}</select></div></div><button class="btn full" ${state.materials.length?'':'disabled'}>＋ Tambahkan bahan ke resep</button></form><div class="card" style="margin-top:14px;background:#f5f9fc"><div class="statlabel">HPP saat ini per parsel</div><div class="stat">${rupiah(allHpp(p))}</div></div>`)}
function addRecipe(e,pid){e.preventDefault();let f=e.target,p=state.products.find(x=>x.id===pid),m=state.materials.find(x=>x.id===f.material.value);if(!m)return;if(!convert(1,f.unit.value,m.unit)){alert('Satuan tidak sejenis. Gunakan satuan yang sesuai dengan bahan.');return}p.recipe.push({materialId:m.id,qty:num(f.qty.value),unit:f.unit.value});save();openRecipe(pid)}function removeRecipe(pid,i){let p=state.products.find(x=>x.id===pid);p.recipe.splice(i,1);save();openRecipe(pid)}
function openPurchase(){if(!state.materials.length){alert('Tambahkan bahan terlebih dahulu di menu Stok.');return}modal('Catat pembelian',`<form onsubmit="savePurchase(event)"><div class="field"><label>Bahan yang dibeli</label><select name="mid" id="purchmid" onchange="purchaseFill()">${state.materials.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Jumlah kemasan dibeli</label><input name="qty" type="number" min="0.001" step="any" value="1" required></div><div class="field"><label>Harga total barang (Rp)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Ongkir pembelian (Rp)</label><input name="shipping" type="number" min="0" value="0"></div><div class="field"><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field wide"><label>Beli dari</label><select name="source"><option>Shopee</option><option>Toko offline / swalayan</option><option>Lainnya</option></select></div></div><div class="notice">Jumlah kemasan akan dikalikan dengan isi kemasan bahan dan ditambahkan ke stok. Harga pembelian akan memperbarui harga modal bahan berdasarkan pembelian terakhir.</div><button class="btn full">Simpan pembelian</button></form>`);purchaseFill()}
function purchaseFill(){let mid=$('#purchmid')?.value,m=state.materials.find(x=>x.id===mid),f=$('#modalroot form');if(m&&f){f.price.value=m.price;}}
function savePurchase(e){e.preventDefault();let f=e.target,m=state.materials.find(x=>x.id===f.mid.value),qty=num(f.qty.value),price=num(f.price.value),ship=num(f.shipping.value);if(!m)return;let oldQty=m.stock,added=qty*m.packQty;m.stock+=added;m.price=qty?(price+ship)/qty:m.price;m.source=f.source.value;state.purchases.push({id:id(),materialId:m.id,materialName:m.name,qty:added,unit:m.unit,total:price+ship,shipping:ship,source:f.source.value,date:f.date.value});save();closeModal();render();toast('Pembelian dan stok diperbarui')}
function openOrder(){modal('Order pelanggan',`<form onsubmit="saveOrder(event)"><div class="formgrid"><div class="field wide"><label>Nama pemesan</label><input name="customer" required placeholder="Nama pelanggan"></div><div class="field wide"><label>Jenis parsel</label><select name="product" id="orderproduct" onchange="orderPrice()">${state.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Harga per parsel (Rp)</label><input name="price" id="orderprice" type="number" min="0" required></div><div class="field"><label>Qty</label><input name="qty" id="orderqty" type="number" min="1" value="1" required oninput="orderTotal()"></div><div class="field"><label>Ongkir (Rp)</label><input name="shipping" id="ordership" type="number" min="0" value="0" oninput="orderTotal()"></div><div class="field"><label>Tanggal order</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Pembayaran via</label><select name="payment"><option>QRIS</option><option>COD</option></select></div><div class="field"><label>Status pembayaran</label><select name="status"><option>Belum bayar</option><option>Lunas</option></select></div><div class="field wide"><label>Total tagihan</label><div class="stat" id="ordertotal">Rp0</div></div></div><button class="btn full">Simpan order</button></form>`);orderPrice()}
function orderPrice(){let p=state.products.find(x=>x.id===$('#orderproduct')?.value);if(p){$('#orderprice').value=p.price;orderTotal()}}function orderTotal(){let f=$('#modalroot form');if(f)$('#ordertotal').textContent=rupiah(num(f.price.value)*num(f.qty.value)+num(f.shipping.value))}
function saveOrder(e){e.preventDefault();let f=e.target,p=state.products.find(x=>x.id===f.product.value),price=num(f.price.value),qty=num(f.qty.value),shipping=num(f.shipping.value);state.orders.push({id:id(),customer:f.customer.value,productId:p?.id,productName:p?.name||'',price,qty,shipping,total:price*qty+shipping,payment:f.payment.value,status:f.status.value,date:f.date.value});save();closeModal();render();toast('Order berhasil disimpan')}
function togglePaid(oid){let o=state.orders.find(x=>x.id===oid);o.status=o.status==='Lunas'?'Belum bayar':'Lunas';save();render()}function deleteOrder(oid){if(confirm('Hapus order ini?')){state.orders=state.orders.filter(x=>x.id!==oid);save();render()}}
function previewFile(file,target){if(!file)return;let r=new FileReader();r.onload=()=>{let el=$('#'+target);el.src=r.result;el.classList.remove('hidden')};r.readAsDataURL(file)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-boo-gift-house-lebaran-2027.json';a.click();URL.revokeObjectURL(a.href);toast('Backup disiapkan')}
function importData(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.materials||!x.orders)throw Error();if(confirm('Pulihkan backup? Data saat ini akan diganti.')){state=x;save();render();toast('Backup berhasil dipulihkan')}}catch(e){alert('File backup tidak valid.')} };r.readAsText(file)}
function exportCSV(){let rows=[['Nama pemesan','Jenis parsel','Harga','Qty','Ongkir','Total','Pembayaran','Status','Tanggal'],...state.orders.map(o=>[o.customer,o.productName,o.price,o.qty,o.shipping,o.total,o.payment,o.status,o.date])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='order-boo-gift-house-2027.csv';a.click();URL.revokeObjectURL(a.href)}
load();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
